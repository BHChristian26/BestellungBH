const normRecipe=x=>String(x??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
const recipeBySale=(()=>{const m={};RECIPE_REGISTRY.rules.forEach(r=>r.sales.forEach(x=>m[normRecipe(x)]=r));return {get:x=>m[normRecipe(x)]||null}})();
function allMasterProducts(){return [...Object.values(MASTER.storage).flat(),...Object.values(MASTER.suppliers).flat(),...(MASTER.foodshop||[]),...(MASTER.foodcorner||[])];}
function findMasterProduct(name){const n=normRecipe(name);const suppliers=Object.values(MASTER.suppliers).flat();const supplierExact=suppliers.find(p=>normRecipe(p.name)===n);if(supplierExact)return supplierExact;const storagePriority=['GetränkeLager','Getränke Kühlung','Tiefkühlung','Fleischkühlung','Gemüse Kühlung','Trocken Lager'];for(const area of storagePriority){const p=(MASTER.storage[area]||[]).find(x=>normRecipe(x.name)===n);if(p)return p;}const exact=allMasterProducts().find(p=>normRecipe(p.name)===n);if(exact)return exact;return allMasterProducts().find(p=>normRecipe(p.name).includes(n)||n.includes(normRecipe(p.name)))||null;}
function recipeMappingInfo(r){if(!r.purchase)return {ok:false,reason:r.note||'Kein Produktmapping hinterlegt.'};const names=String(r.purchase).split(';').map(x=>x.trim()).filter(Boolean),products=names.map(findMasterProduct);if(products.some(p=>!p))return {ok:false,reason:'Produktmapping nicht im aktuellen Master gefunden: '+names.filter((_,i)=>!products[i]).join(', ')};return {ok:true,products};}
function recipeStatus(name){const r=recipeBySale.get(name);if(!r)return {kind:'missing',label:'Fehlt',recipe:null};const map=recipeMappingInfo(r);if(r.status==='confirmed'&&map.ok)return {kind:'confirmed',label:'Bestätigt',recipe:r,mapping:map};return {kind:'attention',label:'Prüfen',recipe:r,mapping:map};}
function registryCounts(){return {total:RECIPE_REGISTRY.rules.length,confirmed:RECIPE_REGISTRY.rules.filter(r=>r.status==='confirmed'&&recipeMappingInfo(r).ok).length,attention:RECIPE_REGISTRY.rules.filter(r=>r.status!=='confirmed'||!recipeMappingInfo(r).ok).length};}
function registryProductLabel(p){return p?p.name:'';}

function renderAdmin(){return '<h2>Admin</h2><div class="tabs"><button class="active" onclick="adminTab=\"products\";render()">Produkte</button><button onclick="adminTab=\"recipes\";render()">Rezepte</button><button onclick="adminTab=\"locations\";render()">Lager / Lieferanten</button><button onclick="adminTab=\"monthly\";render()">Sollbestand</button></div>'+(adminTab==='products'?adminProducts():adminTab==='recipes'?adminRecipes():adminTab==='locations'?adminLocations():adminMonthly())+'<div class="card"><h3>Abgeschlossene Bestellungen</h3>'+(state.history&&state.history.length?state.history.slice(0,20).map(h=>'<div class="card"><strong>'+esc(new Date(h.savedAt).toLocaleString('de-DE'))+'</strong><div class="meta">'+esc(h.businessLabel||h.business)+' · '+h.items.length+' Positionen · '+esc(h.status||'completed')+'</div><div class="meta">'+h.items.slice(0,8).map(i=>esc(i.name)+' × '+esc(i.qty)+' '+esc(i.unit||'')).join(' · ')+(h.items.length>8?' · …':'')+'</div><div class="meta">Verkäufe archiviert: '+(Array.isArray(h.salesSnapshot)?h.salesSnapshot.length:0)+' Zeilen</div></div>').join(''):'<div class="empty">Noch keine abgeschlossenen Bestellungen.</div>')+'</div>'}
function adminProducts(){let all=[];Object.values(MASTER.storage).forEach(a=>all.push(...a));all.push(...MASTER.foodshop,...MASTER.foodcorner);Object.values(MASTER.suppliers).forEach(a=>all.push(...a));let seen=new Set(),items=all.filter(p=>{if(seen.has(p.id))return false;seen.add(p.id);return true});return '<div class="notice">Ausschließen blendet Produkte aus; sie werden nicht gelöscht.</div>'+items.map(p=>{let id=JSON.stringify(p.id);return '<div class="card row"><div><strong>'+esc(p.name)+'</strong><div class="meta">'+esc(p.supplier||p.lager||'')+'</div></div><button class="smallbtn '+(state.excluded[p.id]?'danger':'')+'" onclick="toggleExclude('+id+')">'+(state.excluded[p.id]?'Aktivieren':'Ausschließen')+'</button></div>'}).join('')}
function toggleExclude(id){state.excluded[id]=!state.excluded[id];save();render()}
function adminRecipes(){const c=registryCounts();return '<div class="card"><strong>System-Rezept- und Mappingdaten geladen</strong><div class="sub">'+c.total+' Regeln unabhängig von localStorage. '+c.confirmed+' vollständig bestätigt; '+c.attention+' mit echtem offenen Punkt.</div></div><div class="card"><h3>System-Rezepte / Mappingstatus</h3>'+RECIPE_REGISTRY.rules.map(r=>{const st=r.status==='confirmed'&&recipeMappingInfo(r).ok?'Bestätigt':'Prüfen',mi=recipeMappingInfo(r);return '<div class="card"><strong>'+esc(r.name)+'</strong> <span class="badge">'+st+'</span><div class="meta">Gastronovi: '+esc(r.sales.join(', '))+'</div>'+(r.purchase?'<div class="meta">Mapping: '+esc(r.purchase)+'</div>':'')+(r.qty!==undefined?'<div class="meta">Menge: '+esc(r.qty)+' '+esc(r.unit||'')+' / '+esc(r.per||'')+'</div>':'')+(mi.ok?'<div class="meta">Aufgelöst: '+mi.products.map(registryProductLabel).map(esc).join(', ')+'</div>':'')+(r.note?'<div class="meta">'+esc(r.note)+'</div>':'')+'</div>'}).join('')+'</div><div class="card"><h3>Zusätzliches Rezept hinzufügen</h3><div class="field"><label>Rezeptname</label><input id="rName"></div><div class="field"><label>Yield</label><input id="rYield" type="number" value="1"></div><div class="field"><label>Zutaten JSON</label><textarea id="rIng" rows="5"></textarea></div><button class="primary" onclick="addRecipe()">Speichern</button></div><div class="card"><h3>Eigene gespeicherte Rezepte</h3>'+(state.recipes.map(r=>'<div class="card"><strong>'+esc(r.name)+'</strong><div class="meta">Yield: '+esc(r.yield)+'</div><pre>'+esc(JSON.stringify(r.ingredients,null,2))+'</pre></div>').join('')||'<div class="empty">Noch keine zusätzlichen Rezepte.</div>')+'</div>';}
function adminLocations(){return '<div class="grid"><div class="card"><h3>Lager</h3>'+state.lagers.map(x=>'<div>'+esc(x)+'</div>').join('')+'<div class="field"><input id="newLager" placeholder="Neues Lager"></div><button onclick="addLager()">+ Lager</button></div><div class="card"><h3>Lieferanten</h3>'+state.suppliers.map(x=>'<div>'+esc(x)+'</div>').join('')+'<div class="field"><input id="newSup" placeholder="Neuer Lieferant"></div><button onclick="addSupplier()">+ Lieferant</button></div></div>'}
function adminMonthly(){return '<div class="notice"><strong>Monatliche Sollbestand-Anpassung ist vorbereitet.</strong> Es wird noch nichts automatisch geändert.</div><div class="card">Es fehlt noch deine genaue Regel, wie der neue Sollbestand aus der Nachfrage berechnet werden soll. Danach kann das System Vorschläge machen und dich vor jeder Änderung informieren.</div>'}
function normHeader(x){return normRecipe(x).replace(/[^a-z0-9]+/g,'')}
function parseSalesSheet(ws,sn){
 const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''}), candidates=[];
 rows.slice(0,15).forEach((r,ri)=>r.forEach((v,ci)=>{const h=normHeader(v);if(!h)return;let type=null;if(/^(artikel|artikelname|produkt|produktname|bezeichnung|salesitem|item)$/.test(h)||/(artikel|produkt|bezeichnung).*name/.test(h))type='name';if(/^(menge|anzahl|quantity|qty|verkauft|verkaufsmenge|salesquantity|count)$/.test(h)||/(menge|anzahl|verkauft|quantity|qty)/.test(h))type='qty';if(type)candidates.push({ri,ci,type})}));
 const byRow={}; candidates.forEach(c=>(byRow[c.ri]=byRow[c.ri]||{},byRow[c.ri][c.type]=c.ci));
 const headerRow=Object.keys(byRow).map(Number).find(ri=>byRow[ri].name!==undefined&&byRow[ri].qty!==undefined);
 if(headerRow===undefined)return {rows:[],mode:'unrecognized'};
 const nameCol=byRow[headerRow].name, qtyCol=byRow[headerRow].qty, out=[];
 rows.slice(headerRow+1).forEach(r=>{const n=r[nameCol],q=num(r[qtyCol]);if(n!==''&&n!=null&&q!==null&&String(n).trim())out.push({name:String(n).trim(),qty:q,sheet:sn})});
 return {rows:out,mode:'columns'};
}
async function importSales(file){
 if(!file)return;if(!window.XLSX){alert('Excel-Library wird geladen. Bitte erneut versuchen.');return}
 try{const buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:'array'}),rows=[],unrecognized=[];
  wb.SheetNames.forEach(sn=>{const r=parseSalesSheet(wb.Sheets[sn],sn);if(r.mode==='columns')rows.push(...r.rows);else unrecognized.push(sn)});
  if(!rows.length){alert('Keine eindeutigen Gastronovi-Spalten für Artikel + Menge gefunden. Es wurden keine Verkaufsdaten übernommen.');return}
  state.sales=rows;state.salesImport={fileName:file.name,importedAt:new Date().toISOString(),sheets:wb.SheetNames,unrecognizedSheets:unrecognized};save();render();
 }catch(e){console.error(e);alert('Der Gastronovi-Export konnte nicht gelesen werden. Es wurden keine Daten verändert.');}
}
function addSpecial(){let n=document.getElementById('spName').value,p=num(document.getElementById('spPort').value);if(!n||p===null)return;state.specials.push({name:n,portions:p});save();render()}
function addEvent(){let n=document.getElementById('evName').value,p=num(document.getElementById('evPeople').value),d=document.getElementById('evDate').value;if(!n||p===null)return;state.events.push({name:n,people:p,date:d});save();render()}
function addRecipe(){let n=document.getElementById('rName').value,y=num(document.getElementById('rYield').value)||1,raw=document.getElementById('rIng').value;try{state.recipes.push({name:n,yield:y,ingredients:JSON.parse(raw||'[]')});save();render()}catch(e){alert('Zutaten müssen gültiges JSON sein.')}}
function addLager(){let n=document.getElementById('newLager').value.trim();if(n&&!state.lagers.includes(n))state.lagers.push(n);save();render()}
function addSupplier(){let n=document.getElementById('newSup').value.trim();if(n&&!state.suppliers.includes(n))state.suppliers.push(n);save();render()}
function masterProductById(id){return allMasterProducts().find(p=>p.id===id)||null}
function completeOrder(){
 const entries=Object.entries(state.qty).filter(([id,v])=>v!==''&&v!==null&&v!==undefined&&Number(v)!==0);
 if(!entries.length){alert('Es sind keine Bestellmengen eingetragen.');return}
 if(!confirm('Bestellung abschließen?\n\nDie Bestellung wird als abgeschlossen gespeichert. Die Bestellmengen werden für den nächsten Bestellvorgang zurückgesetzt. Der Lagerbestand wird NICHT verändert.'))return;
 const now=new Date();
 const items=entries.map(([id,qty])=>{const p=masterProductById(id);return {id,name:p?.name||id,supplier:p?.supplier||'',unit:p?.unit||'',packaging:p?.regal||'',qty:Number(qty)}});
 const snapshot={id:'order_'+now.getTime(),status:'completed',savedAt:now.toISOString(),business,businessLabel:business,items,salesSnapshot:Array.isArray(state.sales)?state.sales.map(x=>({...x})):[],salesImport:state.salesImport?{...state.salesImport}:null,planningSnapshot:items.map(i=>({id:i.id,name:i.name,stock:state.stock?.[i.id]??'',target:state.targets?.[i.id]??'',eventExtra:state.eventExtra?.[i.id]??''}))};
 state.history=Array.isArray(state.history)?state.history:[];state.history.unshift(snapshot);if(state.history.length>100)state.history=state.history.slice(0,100);
 state.qty={};state.eventExtra={};state.sales=[];state.salesImport=null;save();render();alert('Bestellung abgeschlossen und gespeichert. Event-Zusatzbestände wurden für den nächsten Bestellvorgang zurückgesetzt. Lagerbestand und normale Sollbestände bleiben erhalten.');
}
function render(){nav();document.getElementById('app').innerHTML=page==='lager'?renderLager():page==='suppliers'?renderSuppliers():page==='gastronovi'?renderGastro():page==='extras'?renderExtras():renderAdmin();const wl=document.getElementById('workflowLager'),ws=document.getElementById('workflowSuppliers');if(wl)wl.classList.toggle('active',page==='lager');if(ws)ws.classList.toggle('active',page==='suppliers');document.querySelectorAll('.footerNav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
render();
</script><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script></body></html>
